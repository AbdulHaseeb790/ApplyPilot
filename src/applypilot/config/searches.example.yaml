# ApplyPilot search configuration — Pakistan + Global Remote

queries:
  - query: "AI Engineer"
    tier: 1
  - query: "Machine Learning Engineer"
    tier: 1
  - query: "Python Developer"
    tier: 1
  - query: "LangChain Developer"
    tier: 1
  - query: "Full Stack Developer"
    tier: 2
  - query: "Backend Developer"
    tier: 2
  - query: "MLOps Engineer"
    tier: 2
  - query: "Data Scientist"
    tier: 2
  - query: "AI Agent Developer"
    tier: 2
  - query: "NLP Engineer"
    tier: 2
  - query: "Software Engineer"
    tier: 3
  - query: "Remote Developer"
    tier: 3
  - query: "Django Developer"
    tier: 3
  - query: "FastAPI Developer"
    tier: 3
  - query: "RAG Developer"
    tier: 3

locations:
  - location: "Karachi"
    remote: false
  - location: "Lahore"
    remote: false
  - location: "Islamabad"
    remote: false
  - location: "Remote"
    remote: true

location:
  accept_patterns:
    - "Karachi"
    - "Lahore"
    - "Islamabad"
    - "Rawalpindi"
    - "Peshawar"
    - "Pakistan"
    - "Remote"
    - "Anywhere"
    - "Dubai"
    - "UAE"
    - "Saudi Arabia"
    - "Qatar"
    - "Bahrain"
    - "Kuwait"
    - "London"
    - "UK"
    - "Germany"
    - "Netherlands"
    - "Canada"
    - "Australia"
    - "Singapore"
    - "Malaysia"
    - "Turkey"
    - "United States"
    - "USA"
  reject_patterns:
    - "onsite only"
    - "clearance required"
    - "TS/SCI"

country: "pakistan"

boards:
  - indeed
  - linkedin

defaults:
  results_per_site: 50
  hours_old: 72

exclude_titles:
  - "intern"
  - "internship"
  - "co-op"
  - "director"
  - "VP"
  - "chief"
  - "principal scientist"